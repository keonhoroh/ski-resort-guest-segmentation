# How Rails connects to PostgreSQL.
#
# The `default` section holds settings shared by every environment.
# `<%= ENV["..."] %>` reads a value from the environment, which dotenv-rails
# fills in from the .env file when the app starts. No passwords live here.
#
# `&default` names this block, and `<<: *default` below means
# "copy in everything from the default block".
default: &default
  adapter: postgresql
  encoding: unicode
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV.fetch("POSTGRES_HOST", "localhost") %>
  port: <%= ENV.fetch("POSTGRES_PORT", 5433) %>
  username: <%= ENV["POSTGRES_USER"] %>
  password: <%= ENV["POSTGRES_PASSWORD"] %>

development:
  <<: *default
  database: liftline_development

# Tests get their own database, which is wiped between test runs.
test:
  <<: *default
  database: liftline_test

# On the live server (Stage 7), the host provides a DATABASE_URL setting,
# which Rails uses automatically instead of the values above.
# The URL holds the host, port, name, and login. This doesn't use *default,
# because a URL with no port would otherwise pick up the local port above.
production:
  adapter: postgresql
  encoding: unicode
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  url: <%= ENV["DATABASE_URL"] %>
